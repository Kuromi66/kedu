name = "pulse-sync"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "sync.kon123.click", custom_domain = true }
]

# 定时清理墓碑：每周日 04:00（UTC）执行一次（Cloudflare cron 星期日为 SUN/1）
[triggers]
crons = ["0 4 * * SUN"]

# D1 database for sync data.
# 1. Run: npx wrangler d1 create pulse
# 2. Copy the returned database_id below.
# 3. Run: npm run migrate:remote
[[d1_databases]]
binding = "DB"
database_name = "pulse"
database_id = "e14c5641-135e-4294-b809-3a58f6cd990d"
migrations_dir = "migrations"
